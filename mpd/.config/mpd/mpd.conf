music_directory			"~/m/mus"
playlist_directory	"~/.local/share/mpd/playlists"
db_file							"~/.local/share/mpd/database"
auto_update					"yes"
pid_file						"~/.local/state/mpd.pid"
state_file					"~/.local/state/mpd"

audio_output	{
	type		"pipewire"
	name		"PipeWire Sound Server"
}

decoder	{
	plugin	"wildmidi"
	enabled	"no"
}

audio_output {
    type "fifo"
    name "visualizer"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}


